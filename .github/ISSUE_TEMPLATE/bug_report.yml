name: Bug
description: A diff Skimless read in a surprising way
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: diff
    attributes:
      label: The smallest diff that shows it
      description: Redact secrets before pasting.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected the packet to do
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skimless version
    validations:
      required: true
